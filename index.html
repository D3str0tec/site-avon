<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Consulta de Produtos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">

  <!-- Biblioteca de código de barras -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>

  <div class="container">
    <h1>Consulta de Produtos</h1>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Buscar por SKU, EAN ou nome do produto"
      >
      <button id="btnBuscar">Buscar</button>
    </div>

    <div class="resultado">
      <h3 id="nomeProduto"></h3>

      <div class="info">
        <p><strong>SKU:</strong> <span id="skuProduto"></span></p>
        <p><strong>EAN:</strong> <span id="eanProduto"></span></p>
      </div>

      <div class="barcode-area">
        <p><strong>Código de Barras (SKU)</strong></p>
        <svg id="barcode"></svg>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
